<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BUG HUNTER - UNLIMITED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New',monospace}
body{background:#0f0f1a;color:#fff;padding:12px;min-height:100vh}
.top{background:#1a1a2e;padding:12px;border-radius:12px;display:flex;justify-content:space-between;border:2px solid #00ff88}
.top b{font-size:14px}
.lang{text-align:center;margin:12px 0}
.lang button{padding:9px 13px;border:none;border-radius:20px;margin:3px;font-weight:bold;cursor:pointer}
.lang .active{background:#00ff88;color:#000}
.lang .inactive{background:#333;color:#fff}
.card{background:#1e1e3a;border:2px solid #333;border-radius:14px;padding:14px}
.q-head{display:flex;justify-content:space-between;margin-bottom:10px;gap:6px;flex-wrap:wrap}
.q-head span{background:#00ff88;color:#000;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.q-head span:last-child{background:#ffd700;color:#000}
.code{background:#000;padding:10px;border-radius:10px}
.line{display:flex;gap:8px;padding:8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.line:hover{background:#222}
.line.selected{background:#ff4757;border-color:#fff}
.ln{color:#888;min-width:20px;text-align:right}
.hint{margin-top:10px;background:#2a2a4a;padding:10px;border-radius:8px;font-size:13px;line-height:1.5}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:#00ff88;color:#000;font-size:17px;font-weight:bold;margin-top:12px;cursor:pointer}
.btn2{background:#ffd700}
.msg{text-align:center;margin-top:10px;font-weight:bold;min-height:22px}
.bar{height:8px;background:#333;border-radius:10px;overflow:hidden;margin-top:10px}
.bar div{height:100%;background:linear-gradient(90deg,#00ff88,#ffd700);width:10%}
.foot{text-align:center;font-size:11px;color:#888;margin-top:12px}
</style>
</head>
<body>
<div class="top"><b>🐛 BUG HUNTER ∞</b><b>⭐ <span id="score">0</span> | 💵 <span id="notes">0</span> | ❤️ <span id="life">3</span> | 🔥 <span id="streak">0</span></b></div>
<div class="bar"><div id="bar"></div></div>
<div class="lang">
<button id="btnC" class="active" onclick="setLang('C')">C LANGUAGE</button>
<button id="btnP" class="inactive" onclick="setLang('PYTHON')">PYTHON</button>
<button id="btnD" class="inactive" onclick="setLang('DS')">DATA STRUCTURE</button>
<button id="btnM" class="inactive" onclick="setLang('MIX')">🔥 MIX ALL</button>
</div>
<div class="card">
<div class="q-head"><span id="qNo">Q 1 ∞ UNLIMITED</span><span id="topic">Topic</span><span id="level">Level 1</span></div>
<div class="code" id="codeBox"></div>
<div class="hint" id="hint">👆 Bug wali line pe tap karo, phir CHECK BUG dabao!</div>
<button class="btn" onclick="check()">🔍 CHECK BUG - BUG PAKDO!</button>
<button class="btn btn2" onclick="nextQ()">⏭️ NEXT QUESTION - NAYA BUG →</button>
<div class="msg" id="msg"></div>
</div>
<div class="foot">AKTU ACS101 + ACS201 | C + Python + DS | UNLIMITED QUESTIONS | Exam ke liye best 🔥</div>
<script>
let lang='C', qNum=1, score=0, notes=0, life=3, streak=0, selected=-1, cur=null;
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function rnd(n){return Math.floor(Math.random()*n)}
function genC(){
  let t=[
    ()=>{let a=2+rnd(20),b=2+rnd(20);return{topic:"C - Add Two Numbers",code:['#include <stdio.h>','int main(){',`int a=${a}, b=${b};`,`printf("%d", a+b);`,'return 0;','}'],bug:2,exp:`printf me %d sahi hai, par a+b ka result ${a+b} hoga. Is line me bug hai: scanf missing nahi hai, par int a,b sahi hai. Actually Bug: printf ke andar ; hai? Nahi - Real Bug: return 0; ke pehle } missing nahi. Trick: Ye code sahi hai, par exam me scanf ke sath & lagana mat bhoolna!`}},
    ()=>{let n=2+rnd(8);return{topic:"C - Even / Odd",code:['#include <stdio.h>','int main(){',`int n=${n};`,`if(n%2=0)`,'printf("Even");','else printf("Odd");','return 0;','}'],bug:3,exp:"= matlab assign hota hai, compare ke liye == lagta hai! Sahi hai if(n%2==0)"}},
    ()=>{return{topic:"C - scanf me & bhool gaye",code:['#include <stdio.h>','int main(){','int a;','printf("Enter: ");','scanf("%d", a);','printf("%d",a);','return 0;','}'],bug:4,exp:"scanf me & lagana MUST hai! Sahi hai scanf(\"%d\", &a); Bina & ke value store nahi hogi!"}},
    ()=>{return{topic:"C - For Loop ; wala Bug",code:['#include <stdio.h>','int main(){','int i;','for(i=1;i<=10;i++);','{ printf("%d ",i); }','return 0;','}'],bug:3,exp:"for ke baad ; mat lagao! ; lagane se loop khali chalega, printf 1 baar hi chalega."}},
    ()=>{return{topic:"C - Factorial Recursion",code:['int fact(int n){','if(n==0) return 1;',`return n * fact(n);`,'}','int main(){ printf("%d",fact(5)); }'],bug:2,exp:"fact(n) likh diya, infinite loop! Sahi hai fact(n-1) - har baar 1 kam karo!"}},
    ()=>{return{topic:"C - Array Index",code:['#include <stdio.h>','int main(){','int a[5]={2,9,4,7,1};','int max=a[0];','for(int i=0;i<=5;i++)','if(a[i]>max) max=a[i];','printf("%d",max);','}'],bug:4,exp:"Array 0-4 tak hai, i<=5 likh diya! i=5 pe Garbage value aayegi. Sahi hai i<5"}},
    ()=>{return{topic:"C - While Infinite Loop",code:['#include <stdio.h>','int main(){','int i=1;','while(i<5)','printf("%d",i);','i++;','return 0;','}'],bug:4,exp:"while me { } nahi hai, to sirf printf loop hoga, i++ kabhi nahi chalega! Infinite Loop! { } lagao."}},
    ()=>{return{topic:"C - Pointer me &",code:['#include <stdio.h>','int main(){','int a=10;','int *p;','p = a;','printf("%d",*p);','return 0;','}'],bug:4,exp:"Pointer me address jata hai! Sahi hai p = &a; Bina & ke crash hoga!"}},
    ()=>{return{topic:"C - Largest of 3",code:['#include <stdio.h>','int main(){','int a=10,b=20,c=15;','if(a>b && a>c) printf("A");','else if(b>a && b>c) printf("B");','else printf("C");','return 0;','}'],bug:5,exp:"Ye logic sahi hai, par b>a && b>c me && matlab AND hai. Dono condition sahi honi chahiye. Trick Q - sab sahi hai!"}},
    ()=>{let n=10+rnd(50);return{topic:"C - Grade Calculator",code:['#include <stdio.h>','int main(){',`int marks=${n};`,'if(marks>=90) printf("A");','else if(marks>=80) printf("B");','else printf("C");','return 0;','}'],bug:3,exp:"marks>=90 sahi hai, >= matlab greater-equal. Agar > likh dete to 90 wala A nahi paata!"}},
  ]; return rand(t)();
}
function genP(){
  let t=[
    ()=>{return{topic:"Python - else me : ",code:['a = int(input("Enter: "))','if a>18:','print("Adult")','else','print("Minor")'],bug:3,exp:"else ke baad : lagana bhool gaya! Sahi hai else:"}},
    ()=>{return{topic:"Python - List Index",code:['l = [10,20,30,40]','print(l[4])','print(len(l))'],bug:1,exp:"List 0-3 tak hai! l[4] IndexError dega! Sahi hai l[3] ya l[-1]"}},
    ()=>{return{topic:"Python - Case Sensitive",code:['def add(a,b):','return a+b','print(add(2,3))','print(Add(2,3))'],bug:3,exp:"Python case-sensitive hai! Add != add. Sahi hai add(2,3)"}},
    ()=>{return{topic:"Python - Dict Key",code:['d = {"name":"Ram","age":20}','print(d["Name"])','print(d["age"])'],bug:1,exp:"Key case-sensitive hai! 'Name' nahi hai, 'name' hai. Sahi hai d[\"name\"]"}},
    ()=>{return{topic:"Python - lower() me ()",code:['s = "hello"','print(s.upper())','print(s.lower)'],bug:2,exp:"lower ek function hai! Sahi hai s.lower() - () lagana hai, warna <function> print hoga!"}},
    ()=>{return{topic:"Python - For Range",code:['for i in range(5):','print(i)','print("Done")'],bug:0,exp:"range(5) = 0,1,2,3,4 dega, 5 nahi! 1-5 chahiye to range(1,6) likho."}},
    ()=>{return{topic:"Python - Input int",code:['a = input("Enter: ")','b = input("Enter: ")','print(a+b)'],bug:2,exp:"input() hamesha string deta hai! '5'+'5' = '55' hoga, 10 nahi! Sahi hai int(input())"}},
    ()=>{return{topic:"Python - Indentation",code:['for i in range(3):','print(i)','print("Done")'],bug:1,exp:"Indentation galat hai to loop se bahar samjha jayega. print(i) ke aage space hona chahiye!"}},
    ()=>{return{topic:"Python - == vs =",code:['a = 10','if a = 10:','print("Yes")'],bug:1,exp:"if me = nahi, == lagta hai! = matlab assign, == matlab compare. Sahi hai if a==10:"}},
    ()=>{return{topic:"Python - File Close",code:['f = open("data.txt","r")','print(f.read())','f.close()'],bug:2,exp:"Ye sahi hai! File kholo, padho, band karo. close() bhool gaye to file lock ho jayegi."}},
  ]; return rand(t)();
}
function genDS(){
  let t=[
    ()=>{return{topic:"DS - Queue FIFO",code:['// Queue - FIFO','enqueue(10)','enqueue(20)','dequeue() // 20 niklega'],bug:3,exp:"Queue FIFO hai - First In First Out. Pehle 10 niklega, 20 nahi!"}},
    ()=>{return{topic:"DS - Stack LIFO",code:['// Stack - LIFO','push(10)','push(20)','pop() // 10 niklega'],bug:3,exp:"Stack LIFO hai - Last In First Out. Last me 20 aaya, pehle 20 niklega, 10 nahi!"}},
    ()=>{return{topic:"DS - BST Rule",code:['// BST: Left < Root < Right','Root=10, Left=5, Right=20','Left me 15 daal diya'],bug:2,exp:"BST me Left me hamesha CHHOTA hoga! 15 > 10 hai, isliye Right me jayega!"}},
    ()=>{return{topic:"DS - BFS Queue",code:['// BFS - Queue use hoti hai','// DFS - Stack / Recursion','BFS me Stack use kiya'],bug:2,exp:"BFS me Queue lagti hai, Stack nahi! DFS me Stack lagti hai. Ulta kar diya!"}},
    ()=>{return{topic:"DS - Binary Search",code:['// Sorted Array [1,3,5,7,9]','mid = (low+high)/2','if(a[mid]==7) found','else if(a[mid]<7) low=mid+1'],bug:2,exp:"Ye sahi hai! Binary Search me mid nikal ke aadha hissa kaat dete hai. O(log n) fast hai!"}},
    ()=>{return{topic:"DS - Linked List malloc",code:['struct Node{int data;','struct Node* next;};','head->next = NULL;','// 1 Node hai'],bug:2,exp:"head ko pehle malloc se memory deni hai! Bina malloc ke head->next crash karega!"}},
    ()=>{return{topic:"DS - Bubble Sort Loop",code:['for(i=0;i<n-1;i++){','for(j=0;j<n;j++){','if(a[j]>a[j+1]) swap;','}}'],bug:1,exp:"Inner loop j<n-i-1 hona chahiye, warna sorted part phir check hoga aur a[n] out of bound!"}},
    ()=>{return{topic:"DS - Linear Search",code:['// Search 7 in [2,5,7,9]','for(i=0;i<n;i++){','if(a[i]==7) found=1;','}'],bug:0,exp:"Linear Search ek-ek karke check karta hai. O(n) time. Sahi hai!"}},
  ]; return rand(t)();
}
function genQ(){
  if(lang=='C') return genC();
  if(lang=='PYTHON') return genP();
  if(lang=='DS') return genDS();
  let r=rnd(3); if(r==0) return genC(); if(r==1) return genP(); return genDS();
}
function setLang(l){lang=l;qNum=1;['btnC','btnP','btnD','btnM'].forEach(id=>document.getElementById(id).className='inactive');document.getElementById(l=='C'?'btnC':l=='PYTHON'?'btnP':l=='DS'?'btnD':'btnM').className='active';render();}
function render(){cur=genQ();selected=-1;document.getElementById('qNo').innerText=`Q ${qNum} ∞ UNLIMITED`;document.getElementById('topic').innerText=cur.topic;document.getElementById('level').innerText='Level '+ (1+Math.floor(qNum/5));document.getElementById('hint').innerText='👆 Bug wali line pe tap karo, phir CHECK BUG dabao!';document.getElementById('msg').innerText='';let html='';cur.code.forEach((line,i)=>{html+=`<div class="line" onclick="selectLine(${i},this)"><span class="ln">${i+1}</span><span>${line.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span></div>`});document.getElementById('codeBox').innerHTML=html;document.getElementById('bar').style.width=Math.min(100,10+qNum*2)+'%';}
function selectLine(i,el){selected=i;document.querySelectorAll('.line').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');}
function check(){if(selected==-1){document.getElementById('msg').innerText='⚠️ Pehle koi line select karo!';return;}if(selected==cur.bug || cur.exp.includes('Trick') || cur.exp.includes('sahi hai')){score+=100;notes+=10;streak++;if(streak%5==0){score+=50;document.getElementById('msg').innerText=`🎉 SAHI! +100 + STREAK BONUS +50! 🔥 ${streak} lagatar!`;}else document.getElementById('msg').innerText=`🎉 SAHI PAKDA! +100 Score +10 Note! 🔥 Streak: ${streak}`;document.getElementById('hint').innerText='✅ EXPLAIN: '+cur.exp;}else{life--;streak=0;document.getElementById('msg').innerText='❌ GALAT! Bug wahan nahi tha!';document.getElementById('hint').innerText='💡 SIKHO: '+cur.exp;if(life<=0){alert(`💥 GAME OVER!\nScore: ${score} | Notes: ${notes} | Questions: ${qNum}\nPhir se khelo, ab to yaad ho gaya!`);life=3;score=0;notes=0;qNum=1;streak=0;}}document.getElementById('score').innerText=score;document.getElementById('notes').innerText=notes;document.getElementById('life').innerText=life;document.getElementById('streak').innerText=streak;}
function nextQ(){qNum++;render();}
render();
</script>
</body>
</html>
