function playSound(type){
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    var ctx = new AC();
    var o = ctx.createOscillator(); var g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    if(type=='good'){ o.frequency.value=880; }
    if(type=='bad'){ o.frequency.value=150; o.type='sawtooth'; }
    if(type=='tick'){ o.frequency.value=1200; o.type='square'; }
    g.gain.value=0.12; o.start(); o.stop(ctx.currentTime+0.22);
  }catch(e){}
}

function shuffle(arr){ for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return arr; }
function buildPool(){
  var filtered = filter=='ALL' ? QB.slice() : QB.filter(function(q){ return q.unit==filter; });
  var fresh = filtered.filter(function(q){ return !usedIds[q.id]; });
  if(fresh.length==0){ usedIds={}; fresh=filtered.slice(); }
  pool = shuffle(fresh);
}
function getNextQ(){ if(pool.length==0) buildPool(); var q=pool.pop(); usedIds[q.id]=true; return q; }
function setFilter(f){
  filter=f; examMode=false;
  var ids=['fAll','fU1','fU2','fU3','fU4','fU5'];
  for(var i=0;i<ids.length;i++) document.getElementById(ids[i]).className='inactive';
  document.getElementById(f=='ALL'?'fAll':f=='U1'?'fU1':f=='U2'?'fU2':f=='U3'?'fU3':f=='U4'?'fU4':'fU5').className='active';
  pool=[]; qNum=0; render();
}
function startTimer(){
  clearInterval(timerInt); timeLeft=30;
  document.getElementById('time').innerText=timeLeft;
  document.getElementById('tbar').style.width='100%';
  timerInt=setInterval(function(){
    timeLeft--; document.getElementById('time').innerText=timeLeft;
    document.getElementById('tbar').style.width=(timeLeft/30*100)+'%';
    if(timeLeft<=0){
      clearInterval(timerInt); playSound('bad');
      life--; document.getElementById('life').innerText=life;
      document.getElementById('msg').innerText='TIME UP! Life -1!';
      document.getElementById('hint').innerText='SIKHO: '+cur.exp+' | Sahi line thi: '+(cur.bug+1);
      if(life<=0){ gameOver(); } else { setTimeout(function(){ nextQ(); },2000); }
    }
  },1000);
}
function render(){
  cur=getNextQ(); qNum++; selected=-1;
  if(examMode){ examCount++; if(examCount>10){ finishExam(); return; } }
  document.getElementById('qNo').innerText = examMode ? ('EXAM Q '+examCount+'/10') : ('Q '+qNum+' - Total '+QB.length+' - No Repeat!');
  document.getElementById('topic').innerText=cur.topic;
  document.getElementById('unitTag').innerText=cur.unit;
  document.getElementById('hint').innerText = examMode ? 'EXAM MODE - No Hint! Khud se pakdo!' : 'Bug wali line pe tap karo, phir CHECK BUG dabao!';
  document.getElementById('msg').innerText='';
  var html='';
  for(var i=0;i<cur.code.length;i++){ html += '<div class="line" onclick="selectLine('+i+',this)"><span class="ln">'+(i+1)+'</span><span>'+cur.code[i].replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</span></div>'; }
  document.getElementById('codeBox').innerHTML=html;
  startTimer(); showHigh();
}
function selectLine(i,el){ selected=i; var all=document.querySelectorAll('.line'); for(var k=0;k<all.length;k++) all[k].classList.remove('selected'); el.classList.add('selected'); }
function check(){
  if(selected==-1){ document.getElementById('msg').innerText='Pehle koi line select karo!'; return; }
  clearInterval(timerInt);
  var isCorrect = (selected==cur.bug);
  if(cur.exp.indexOf('sahi hai')>=0 && cur.bug==0) isCorrect=true;
  if(isCorrect){
    score+=100; notes+=10; streak++; if(examMode) examScore++;
    playSound('good');
    if(streak%5==0){ score+=50; document.getElementById('msg').innerText='SAHI! +100 + BONUS +50! Streak '+streak; }
    else document.getElementById('msg').innerText='SAHI PAKDA! +100 +10 Note! Streak '+streak;
    if(!examMode) document.getElementById('hint').innerText='EXPLAIN: '+cur.exp;
    else document.getElementById('hint').innerText='Sahi! Next pe jao!';
  } else {
    life--; streak=0; playSound('bad');
    document.getElementById('msg').innerText='GALAT! Bug wahan nahi tha!';
    if(!examMode) document.getElementById('hint').innerText='SIKHO: '+cur.exp+' | Sahi line thi: '+(cur.bug+1);
    else document.getElementById('hint').innerText='Galat! Next pe jao!';
    if(life<=0){ gameOver(); return; }
  }
  document.getElementById('score').innerText=score;
  document.getElementById('notes').innerText=notes;
  document.getElementById('life').innerText=life;
  document.getElementById('streak').innerText=streak;
  saveHigh();
}
function nextQ(){ if(examMode && examCount>=10){ finishExam(); return; } render(); }
function gameOver(){
  clearInterval(timerInt); saveHigh();
  alert('GAME OVER! Score: '+score+' | Notes: '+notes+' | Q: '+qNum);
  life=3; score=0; notes=0; qNum=0; streak=0; examMode=false;
  document.getElementById('score').innerText=score; document.getElementById('notes').innerText=notes; document.getElementById('life').innerText=life; document.getElementById('streak').innerText=streak;
  render();
}
function startExam(){
  examMode=true; examCount=0; examScore=0; score=0; life=3; streak=0; pool=[]; qNum=0;
  alert('EXAM MODE START! 10 Questions | Har Q 30 Sec | No Hint | Pass = 6+ sahi');
  render();
}
function finishExam(){
  clearInterval(timerInt);
  var pass = examScore>=6;
  alert((pass?'PASS!':'FAIL!')+' Exam Score: '+examScore+'/10');
  saveHigh(); examMode=false; examCount=0; score=0; life=3; render();
}
function saveHigh(){
  try{
    var name = document.getElementById('pname').value.trim() || 'Player';
    var old = JSON.parse(localStorage.getItem('bugHunterHigh')||'{"score":0,"name":"-"}');
    if(score>old.score){ localStorage.setItem('bugHunterHigh', JSON.stringify({score:score, name:name, notes:notes})); }
  }catch(e){}
}
function showHigh(){
  try{
    var h = JSON.parse(localStorage.getItem('bugHunterHigh')||'{"score":0,"name":"-","notes":0}');
    document.getElementById('highBox').innerHTML='HIGH SCORE: <b>'+h.name+' - '+h.score+' ⭐ | '+h.notes+' Notes</b><br>Total Questions: '+QB.length+' | Without Repetition | Unit 1-5 Only';
  }catch(e){}
}
buildPool(); render();
